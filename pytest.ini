[pytest]
# Root-level collection guard (B1 fix): bare `pytest` from the repo root must
# collect only the CURRENT suite. Archived legacy tests under
# My_Compilation/archive/legacy_members/ use stale top-level imports
# (e.g. `from cusum_drift import ...`) and are HISTORICAL artefacts, not
# runnable tests. `testpaths` scopes default collection; `norecursedirs`
# keeps the archive out even when an explicit path is given.
testpaths = My_Compilation/tests
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv .venv __pycache__ .pytest_cache .mypy_cache .ruff_cache archive
