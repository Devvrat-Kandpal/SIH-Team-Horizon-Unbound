[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-arjuna"
version = "2.1.0"
description = "AI-Driven Space-Grade Component Burn-In Telemetry & Screening Engine for ISRO"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Team ARJUNA (SIH 26170)" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "archive",
    "Model",
    "simulation",
    "criticality_config.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (FastAPI Depends/Security)
    "UP006",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --durations=5"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

